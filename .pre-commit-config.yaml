repos:
  - repo: local
    hooks:
      - id: code-quality
        name: SourceCrate code quality
        entry: uv run --locked --extra dev python scripts/validate_code_quality.py
        language: system
        files: ^(source_crate/.*\.py|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: offline-tests
        name: SourceCrate offline tests
        entry: uv run --locked --extra dev --extra http pytest -q
        language: system
        files: ^(source_crate/|tests/|pyproject\.toml|uv\.lock)
        pass_filenames: false
