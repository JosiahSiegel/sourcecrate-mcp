repos:
  - repo: local
    hooks:
      - id: comprehensive-validation
        name: Comprehensive MCP Validation (matches CI workflow exactly)
        entry: python3
        args: ["scripts/validate_all.py"]
        language: system
        files: ^paperez_mcp/.*\.py$
        pass_filenames: false
        verbose: true

  - repo: local
    hooks:
      - id: dependency-check
        name: Dependency Validation
        entry: python3
        args: ["scripts/validate_dependencies.py"]
        language: system
        files: ^(requirements.*\.txt|pyproject\.toml|setup\.py)$
        pass_filenames: false

  - repo: local
    hooks:
      - id: config-validation
        name: Configuration Validation (on config changes)
        entry: python3
        args: ["scripts/validate_imports.py"]
        language: system
        files: \.paperez/config/.*\.ya?ml$
        pass_filenames: false