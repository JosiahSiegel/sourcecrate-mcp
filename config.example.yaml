# SourceCrate Example Custom Configuration
# Copy this file to ~/.paperez/config/config.yaml to use it
# Or set PAPEREZ_CONFIG_PATH environment variable to point to your config
#
# Last ToS review: 2025-01-07

version: "1.0"

# ============================================================================
# ENVIRONMENT VARIABLES FOR ToS-COMPLIANT SOURCES
# ============================================================================
# Set these environment variables for enhanced functionality:
#
# OPENALEX_EMAIL - Your email for OpenAlex polite pool (unlimited rate limits)
#   fly secrets set OPENALEX_EMAIL=your.email@example.com
#
# UNPAYWALL_EMAIL - Your email for Unpaywall API (30M+ open access PDFs)
#   fly secrets set UNPAYWALL_EMAIL=your.email@example.com
#
# All sources below are ToS-compliant and verified as of 2025-01-07

# ============================================================================
# GLOBAL SETTINGS
# ============================================================================
default_category: null  # Use intelligent BM25 routing
max_concurrent_searches: 15
global_cache_enabled: true
global_cache_expire: 7200  # 2 hours
default_output_dir: .paperez
cleanup_temp_files: true
use_default_sources: true  # Inherit all built-in sources

# ============================================================================
# ToS-COMPLIANT SOURCE ENHANCEMENTS
# ============================================================================
sources:
  # OpenAlex - Enhanced with polite pool (see medical.yaml)
  # Automatically uses OPENALEX_EMAIL environment variable
  # ToS: CC0 public domain, commercial use allowed
  # Rate limits: 100K/day → UNLIMITED with polite pool
  openalex:
    enabled: true

  # All other default sources are already ToS-compliant
  # See paperez_mcp/default_configs/base.yaml for full list

# ============================================================================
# OPTIONAL: CORE Repository (Requires free API key)
# ============================================================================
# Coverage: 9.5M+ open access papers (excellent for humanities/social sciences)
# ToS: Commercial use allowed with attribution
# Rate limits: 10 requests/minute (free tier)
# API Key: FREE at https://core.ac.uk/services/api (2-3 min signup)
#
# To enable:
# 1. Register at https://core.ac.uk/services/api
# 2. Get your free API key
# 3. Set: fly secrets set CORE_API_KEY=your_key_here
# 4. Uncomment the section below:
#
# core_repository:
#   name: core_repository
#   type: http_api
#   enabled: true
#   config:
#     description: CORE - 9.5M+ open access papers across all disciplines
#     base_url: https://api.core.ac.uk/v3
#     search_path: /search/works
#     query_param: q
#     limit_param: limit
#     extra_params:
#       api_key: ${CORE_API_KEY}
#     field_mappings:
#       title: title
#       authors: authors
#       abstract: abstract
#       year: yearPublished
#       doi: doi
#       url: downloadUrl
#       pdf_url: downloadUrl

# ============================================================================
# DISABLED SOURCES (No usable API or ToS restrictions)
# ============================================================================
# These sources are NOT available due to API/ToS limitations:
# ❌ Google Scholar - No official API, ToS prohibits automation
# ❌ SSRN - ToS reserves data mining rights, restricted access
# ❌ ResearchGate - No public API, ToS prohibits automation
# ❌ ERIC - No JSON/XML API (verified Jan 7, 2025)

# ============================================================================
# UNPAYWALL INTEGRATION
# ============================================================================
# Unpaywall is a PDF enhancement service (NOT a search source)
# Automatically finds open access PDFs during paper download
# Uses UNPAYWALL_EMAIL environment variable if set
# No additional configuration needed - works automatically

# ============================================================================
# DEPLOYMENT INSTRUCTIONS
# ============================================================================
# Local usage:
#   1. Copy this file to ~/.paperez/config/config.yaml
#   2. Set environment variables: export OPENALEX_EMAIL=your@email.com
#
# Fly.io deployment:
#   1. Set secrets: fly secrets set OPENALEX_EMAIL=your@email.com
#   2. Secrets automatically populate ${OPENALEX_EMAIL} in configs
#   3. Deploy: fly deploy -a paperez-api
