# Complete Configuration Example - All Options Demonstrated
# Shows all configuration capabilities and options available in PaperezMCP
# Use this as a reference for understanding the full system

# Version and basic settings
version: "1.0"
default_category: "comprehensive"
max_concurrent_searches: 10
global_cache_enabled: true
global_cache_expire: 3600
default_output_dir: ".paperez"
cleanup_temp_files: true

# User control options
use_default_sources: true  # Set to false to disable all built-in sources

# Query routing configuration
routing:
  enabled: true
  fallback_enabled: true
  domain_keywords:
    medical:
      - "medical"
      - "clinical"
      - "patient"
      - "treatment"
    computer_science:
      - "algorithm"
      - "machine learning"
      - "artificial intelligence"
    physics:
      - "quantum"
      - "physics"
      - "engineering"
  domain_categories:
    medical: "medical"
    computer_science: "preprints"
    physics: "preprints"

# Source configurations (override built-in sources or add new ones)
sources:
  # Override built-in CrossRef with custom settings
  crossref:
    name: "crossref"
    type: "http_api"
    enabled: true
    timeout: 45  # Increased timeout
    max_retries: 5  # More retries
    cache_expire: 7200  # Longer cache
    config:
      description: "Primary academic publisher database (customized)"
      base_url: "https://api.crossref.org"
      search_path: "/works"
      query_param: "query"
      limit_param: "rows"
      response_format: "json"
      results_path: "message.items"
      extra_params:
        sort: "relevance"
        order: "desc"
        mailto: "your_email@example.com"  # User email for polite pool
      field_mappings:
        title: "title.0"
        authors: "author"
        doi: "DOI"
        abstract: "abstract"
        journal: "container-title.0"
        year: "published-print.date-parts.0.0"
        url: "URL"
        citation_count: "is-referenced-by-count"
      rate_limit_delay: 0.05  # Faster rate (with polite pool)

  # Add a custom source example
  custom_api_example:
    name: "custom_api_example"
    type: "http_api"
    enabled: false  # Disabled by default (template)
    timeout: 30
    max_retries: 3
    cache_expire: 3600
    config:
      description: "Example custom REST API source"
      base_url: "https://api.example.com/v1"
      search_path: "/papers/search"
      query_param: "q"
      limit_param: "limit"
      response_format: "json"
      results_path: "data.papers"
      extra_params:
        format: "json"
        sort: "relevance"
      field_mappings:
        title: "title"
        authors: "authors"
        abstract: "abstract"
        journal: "journal.name"
        year: "publication_year"
        doi: "doi"
        url: "url"
        pdf_url: "pdf_link"
        citation_count: "citations"
      # Optional authentication
      # api_key: "your-api-key-here"
      # auth_header: "Authorization"
      # auth_type: "Bearer"
      rate_limit_delay: 0.5

# Categories (override built-in or create new ones)
categories:
  # Override comprehensive category
  comprehensive:
    name: "comprehensive"
    display_name: "Comprehensive Search (Customized)"
    description: "Search across all sources with custom settings"
    type: "standard"
    sources:
      - "crossref"
      - "semantic_scholar"
      - "arxiv"
      - "pubmed"
      - "custom_api_example"  # Include custom source
    max_results_per_source: 6  # More results per source
    parallel_search: true

  # Create custom category
  premium_sources:
    name: "premium_sources"
    display_name: "Premium Academic Sources"
    description: "High-quality, curated academic sources only"
    type: "standard"
    sources:
      - "crossref"
      - "pubmed"
      - "semantic_scholar"
    max_results_per_source: 10
    parallel_search: true

  # Meta-category example
  ai_research_comprehensive:
    name: "ai_research_comprehensive"
    display_name: "AI Research (Comprehensive)"
    description: "Combines preprints and journals for AI research"
    type: "meta"
    includes:
      - "preprints"
      - "premium_sources"
    merge_strategy: "weighted_union"
    weights:
      preprints: 0.7  # Emphasize latest research
      premium_sources: 0.3

# This configuration demonstrates:
# 1. Overriding built-in sources with custom settings
# 2. Adding new custom REST API sources
# 3. Creating custom categories and meta-categories
# 4. Query routing configuration
# 5. All available global settings
# 6. Authentication and rate limiting options