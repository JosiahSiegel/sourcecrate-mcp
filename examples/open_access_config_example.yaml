# Open Access Config Example - Custom Category with Selected Sources
# Demonstrates creating custom categories while keeping all built-in sources
# Built-in sources remain available; this adds custom open access categories

categories:
  # Custom open access category using built-in sources
  open_access_priority:
    name: "open_access_priority"
    display_name: "Open Access Priority"
    description: "Focus on freely available full-text articles from built-in sources"
    type: "standard"
    sources:
      - "arxiv"           # Built-in preprint repository
      - "pubmed_central"  # Built-in open access biomedical
      - "semantic_scholar" # Built-in (has open access PDFs)
      - "doaj"            # Built-in open access journals
      - "europe_pmc"      # Built-in life sciences
    max_results_per_source: 6
    parallel_search: true

  # Pure open access repositories only
  open_repositories:
    name: "open_repositories"
    display_name: "Open Repositories Only"
    description: "Search only fully open repositories (no paywall sources)"
    type: "standard"
    sources:
      - "arxiv"
      - "pubmed_central"
      - "doaj"
    max_results_per_source: 10
    parallel_search: true

# Set open access as default category
default_category: "open_access_priority"

# All built-in sources remain available (CrossRef, Semantic Scholar, PubMed, etc.)
# This config just adds new categories that focus on open access content
# Users can still access comprehensive search and all other built-in categories