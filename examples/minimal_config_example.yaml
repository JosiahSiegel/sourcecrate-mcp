# Minimal Config Example - Override Specific Sources
# Copy this to ~/.paperez/config.yaml to demonstrate source overrides
# Built-in sources remain available, but specific ones are customized

# Override specific built-in sources
sources:
  # Disable CrossRef (override built-in config)
  crossref:
    enabled: false

  # Customize Semantic Scholar rate limits (override built-in config)
  semantic_scholar:
    name: semantic_scholar
    type: http_api
    enabled: true
    timeout: 60  # Increased timeout
    cache_expire: 7200  # Longer cache
    config:
      description: AI-powered academic search engine (customized rate limits)
      base_url: https://api.semanticscholar.org/graph/v1
      search_path: /paper/search
      query_param: query
      limit_param: limit
      response_format: json
      results_path: data
      extra_params:
        fields: paperId,title,authors,year,abstract,venue,citationCount,url,openAccessPdf
      field_mappings:
        title: title
        authors: authors
        year: year
        abstract: abstract
        journal: venue
        doi: externalIds.DOI
        url: url
        pdf_url: openAccessPdf.url
        citation_count: citationCount
      rate_limit_delay: 2.0  # More conservative rate limit

# All other built-in sources (arXiv, PubMed, etc.) remain available with default settings
# This demonstrates selective override while keeping most defaults