# User-Only Sources Example - Disable Built-in Sources
# Demonstrates use_default_sources: false to use only custom sources
# No built-in sources will be loaded; only user-defined sources available

# Disable all built-in sources
use_default_sources: false

sources:
  # Example 1: Europe PMC (39M+ life sciences abstracts, no API key needed)
  europe_pmc:
    name: europe_pmc
    type: http_api
    enabled: true
    timeout: 30
    config:
      description: 'Europe PMC - Life sciences database with 39M+ abstracts'
      base_url: 'https://www.ebi.ac.uk/europepmc/webservices/rest'
      search_path: '/search'
      query_param: 'query'
      limit_param: 'pageSize'
      response_format: 'json'
      results_path: 'resultList.result'
      extra_params:
        format: 'json'
        resultType: 'core'
      field_mappings:
        title: 'title'
        authors: 'authorString'
        abstract: 'abstractText'
        journal: 'journalTitle'
        year: 'pubYear'
        doi: 'doi'
        url: 'fullTextUrlList.fullTextUrl.0.url'
        citation_count: 'citedByCount'
      rate_limit_delay: 0.2

  # Example 2: Directory of Open Access Journals (2.1M+ open access articles)
  doaj:
    name: doaj
    type: http_api
    enabled: true
    timeout: 30
    config:
      description: 'Directory of Open Access Journals - 2.1M+ open access articles'
      base_url: 'https://doaj.org/api/search'
      search_path: '/articles/_search'
      query_param: 'q'
      limit_param: 'pageSize'
      response_format: 'json'
      results_path: 'results'
      field_mappings:
        title: 'bibjson.title'
        authors: 'bibjson.author'
        abstract: 'bibjson.abstract'
        journal: 'bibjson.journal.title'
        year: 'bibjson.year'
        doi: 'bibjson.identifier.0.id'
        url: 'bibjson.link.0.url'
      rate_limit_delay: 0.5

  # Example 3: CORE (requires free API key)
  core_ac_uk:
    name: core_ac_uk
    type: http_api
    enabled: false  # Set to true after adding API key
    timeout: 30
    config:
      description: 'CORE - Open access research papers aggregator'
      base_url: 'https://api.core.ac.uk/v3'
      search_path: '/search/works'
      query_param: 'q'
      limit_param: 'limit'
      response_format: 'json'
      results_path: 'results'
      api_key: 'YOUR_API_KEY_HERE'  # Get free key from https://core.ac.uk/services/api/
      auth_header: 'Authorization'
      auth_type: 'Bearer'
      field_mappings:
        title: 'title'
        authors: 'authors'
        abstract: 'abstract'
        journal: 'journals.0.title'
        year: 'yearPublished'
        doi: 'doi'
        url: 'downloadUrl'
        pdf_url: 'fullTextPdfUrl'
      rate_limit_delay: 0.1

  # Example 4: How to add a hypothetical API source
  # (This is just an example - replace with real API details)
  my_university_repo:
    name: my_university_repo
    type: http_api
    enabled: false  # Enable after configuring
    timeout: 30
    config:
      description: 'My University Institutional Repository'
      base_url: 'https://repository.myuniversity.edu/api'
      search_path: '/search'
      query_param: 'q'
      limit_param: 'limit'
      response_format: 'json'
      results_path: 'items'
      # Optional authentication
      # api_key: 'your-api-key'
      # auth_header: 'X-API-Key'
      # auth_type: 'ApiKey'
      field_mappings:
        title: 'metadata.title'
        authors: 'metadata.creators'
        abstract: 'metadata.description'
        year: 'metadata.date'
        url: 'handle'
        pdf_url: 'downloads.0.url'
      extra_params:
        type: 'thesis'
        status: 'published'
      rate_limit_delay: 1.0

categories:
  # Categories using only user-defined sources (no built-in sources available)
  user_comprehensive:
    name: "user_comprehensive"
    display_name: "User Sources Only"
    description: "Search across all user-defined sources"
    type: "standard"
    sources:
      - "europe_pmc"
      - "doaj"
      # - "core_ac_uk"  # Uncomment if you have API key
    max_results_per_source: 8
    parallel_search: true

  life_sciences_only:
    name: "life_sciences_only"
    display_name: "Life Sciences (User Sources)"
    description: "Life sciences from user-configured sources only"
    type: "standard"
    sources:
      - "europe_pmc"
    max_results_per_source: 15
    parallel_search: true

# Set default category to use user sources
default_category: "user_comprehensive"

# How to use this config:
# 1. Copy to ~/.paperez/config.yaml
# 2. Restart PaperezMCP
# 3. Only the sources defined above will be available (no built-in sources)
# 4. Use "user_comprehensive" category for searching

# This demonstrates complete control over sources - perfect for organizations
# that want to use only specific, approved academic databases.