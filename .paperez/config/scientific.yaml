# Scientific Research Configuration
# Sources and categories for STEM fields, preprints, and general scientific research

# Scientific research sources
sources:
  crossref:
    name: crossref
    type: http_api
    enabled: true
    timeout: 45
    max_retries: 5
    cache_expire: 7200
    config:
      description: Primary academic publisher database (enhanced)
      base_url: https://api.crossref.org
      search_path: /works
      query_param: query
      limit_param: rows
      response_format: json
      results_path: message.items
      extra_params:
        sort: relevance
        order: desc
        mailto: research@paperez.org
      field_mappings:
        title: title.0
        authors: author
        doi: DOI
        abstract: abstract
        journal: container-title.0
        year: published-print.date-parts.0.0
        url: URL
        citation_count: is-referenced-by-count
      rate_limit_delay: 0.05

  semantic_scholar:
    name: semantic_scholar
    type: http_api
    enabled: true
    timeout: 60
    max_retries: 5  # Increased for exponential backoff
    cache_expire: 7200
    config:
      description: "AI-powered academic search engine (RATE LIMITED: 1 RPS for API keys, 5000/5min shared for unauthenticated)"
      base_url: https://api.semanticscholar.org/graph/v1
      search_path: /paper/search
      query_param: query
      limit_param: limit
      response_format: json
      results_path: data
      extra_params:
        fields: paperId,title,authors,year,abstract,venue,citationCount,url,openAccessPdf,externalIds
      # Optional API key for higher rate limits
      auth_type: ApiKey
      auth_header: x-api-key
      # api_key: "YOUR_API_KEY_HERE"  # Get from semanticscholar.org/product/api#api-key-form
      field_mappings:
        title: title
        authors: authors
        year: year
        abstract: abstract
        journal: venue
        doi: externalIds.DOI
        url: url
        pdf_url: openAccessPdf.url
        citation_count: citationCount
      rate_limit_delay: 1.1  # Conservative 1.1 seconds (under 1 RPS) for API key users
      exponential_backoff: true  # Required by Semantic Scholar
      backoff_base: 2  # Base multiplier for exponential backoff
      backoff_max_delay: 60  # Maximum delay between retries
      # NOTE: Rate limits:
      # - Unauthenticated: 5,000 requests per 5 minutes (shared pool)
      # - API key users: 1 RPS (requests per second)
      # - Exponential backoff required for system stability
      # Instructions for API key (optional but recommended):
      # 1. Go to semanticscholar.org/product/api#api-key-form
      # 2. Submit request with your use case
      # 3. Add received API key to api_key field above
      # 4. Reduces rate_limit_delay to 1.1 seconds for 1 RPS compliance

  arxiv:
    name: arxiv
    type: builtin
    enabled: true
    function_name: search_arxiv
    timeout: 30
    max_retries: 3
    cache_expire: 3600
    config:
      description: Preprint repository for STEM fields
      coverage: physics, mathematics, computer science, biology

  doaj:
    name: doaj
    type: http_api
    enabled: true
    timeout: 30
    max_retries: 3
    cache_expire: 3600
    config:
      description: Directory of Open Access Journals
      coverage: peer-reviewed open access articles across all subjects
      base_url: https://doaj.org/api/v4
      search_path: /search/articles/_search
      query_param: q
      limit_param: pageSize
      response_format: json
      results_path: results
      field_mappings:
        title: bibjson.title
        authors: bibjson.author
        abstract: bibjson.abstract
        journal: bibjson.journal.title
        year: bibjson.year
        doi: bibjson.identifier.0.id
        url: bibjson.link.0.url
      rate_limit_delay: 0.5

  openalex:
    name: openalex
    type: http_api
    enabled: true
    timeout: 30
    max_retries: 3
    cache_expire: 7200
    config:
      description: Open catalog of global research system (240M+ works)
      coverage: comprehensive multidisciplinary academic database
      base_url: https://api.openalex.org
      search_path: /works
      query_param: search
      limit_param: per-page
      response_format: json
      results_path: results
      extra_params:
        mailto: research@paperez.org
      field_mappings:
        title: title
        authors: authorships
        abstract: abstract_inverted_index
        journal: primary_location.source.display_name
        year: publication_year
        doi: doi
        url: primary_location.landing_page_url
        pdf_url: open_access.oa_url
        citation_count: cited_by_count
      rate_limit_delay: 0.1


# Scientific research categories
categories:
  academic_premium:
    name: academic_premium
    display_name: Premium Academic Sources
    description: High-quality peer-reviewed sources for authoritative research
    type: standard
    sources:
      - crossref
      - semantic_scholar
      - openalex
      - doaj
    max_results_per_source: 6
    parallel_search: true

  preprints:
    name: preprints
    display_name: Preprints & Latest Research
    description: Focus on preprint repositories for cutting-edge research
    type: standard
    sources:
      - arxiv
      - semantic_scholar
      - openalex
    max_results_per_source: 6
    parallel_search: true

  open_access:
    name: open_access
    display_name: Open Access Publications
    description: Focus on freely available full-text articles
    type: standard
    sources:
      - arxiv
      - semantic_scholar
      - openalex
      - doaj
    max_results_per_source: 5
    parallel_search: true

