# Business & Economics Research Configuration
# Sources and categories for business, economics, finance, and management research

# Business research sources
sources:

  repec:
    name: repec
    type: http_api
    enabled: false  # DISABLED: Requires special API access - contact team@mail.authors.repec.org
    timeout: 30
    max_retries: 3
    cache_expire: 7200
    config:
      description: "RePEc - Economics research papers (REQUIRES API ACCESS: Contact Christian Zimmermann at team@mail.authors.repec.org to request access code tied to IP address)"
      coverage: economics, finance, business research papers
      base_url: https://ideas.repec.org/api
      search_path: /papers  # NOTE: This is incorrect - RePEc uses function-based API, not search endpoint
      query_param: q
      limit_param: limit
      response_format: json
      results_path: results
      extra_params:
        format: json
        # access_code: "REQUIRED"  # Must be provided by RePEc team
      field_mappings:
        title: title
        authors: authors
        abstract: abstract
        journal: journal
        year: year
        url: url
        citation_count: citation_count
      rate_limit_delay: 0.2
      # NOTE: RePEc API doesn't provide search functionality, only specific functions like:
      # - getref (get paper by handle)
      # - getrecentpapers (get recent papers)
      # - getpubsfromwpseries (get publications from working paper series)
      # - getauthorshortid (get author info)

  openalex:
    name: openalex
    type: http_api
    enabled: true
    timeout: 30
    max_retries: 3
    cache_expire: 7200
    config:
      description: Open catalog with extensive business/economics coverage
      coverage: comprehensive multidisciplinary including business research
      base_url: https://api.openalex.org
      search_path: /works
      query_param: search
      limit_param: per-page
      response_format: json
      results_path: results
      extra_params:
        mailto: research@paperez.org
      field_mappings:
        title: title
        authors: authorships
        abstract: abstract_inverted_index
        journal: primary_location.source.display_name
        year: publication_year
        doi: doi
        url: primary_location.landing_page_url
        pdf_url: open_access.oa_url
        citation_count: cited_by_count
      rate_limit_delay: 0.1

# Business research categories
categories:
  business:
    name: business
    display_name: Business & Economics Research
    description: Business, economics, finance, and management research
    type: standard
    sources:
      # - repec  # DISABLED: Requires special API access
      - openalex
      - crossref  # From scientific.yaml
      - semantic_scholar  # From scientific.yaml
    max_results_per_source: 6
    parallel_search: true

