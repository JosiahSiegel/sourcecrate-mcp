# PaperezMCP Complete Default Configuration
# This is the comprehensive configuration file used by the MCP server
# Includes all built-in sources and enhanced settings
# Users can override these settings by placing their own config.yaml in their .paperez directory

# TERMS OF SERVICE COMPLIANCE NOTES:
# - All sources use legitimate public APIs designed for academic research
# - CrossRef: Requires email in requests (configured via mailto param)
# - Semantic Scholar: 1 RPS rate limit, attribution required for publications
# - arXiv: 1 request per 3 seconds, CC0 metadata license
# - PubMed/PMC: NCBI rate limits (3 RPS without API key), email registration recommended
# - Europe PMC: Privacy notice agreement, ~10 request limit
# - ClinicalTrials.gov: US Government database, ~50 requests/minute, public domain
# - DOAJ: 2 requests/second, CC BY-SA for journals, CC0 for articles
# - HathiTrust: Small-scale queries only, not for bulk retrieval
# - Internet Archive: ~1 RPS, non-commercial use only
# - Google Scholar: Disabled (no official API)
# - SSRN: Disabled (ToS reserves data mining rights, restricted API access)

# Version and basic settings
version: "1.0"
default_category: comprehensive
max_concurrent_searches: 15  # Higher concurrency for comprehensive setup
global_cache_enabled: true
global_cache_expire: 7200  # Longer cache for comprehensive setup
default_output_dir: .paperez
cleanup_temp_files: true

# User control options
use_default_sources: true  # Set to false to disable all built-in sources

# Query routing configuration
routing:
  enabled: true
  fallback_enabled: true
  domain_keywords:
    medical:
      - medical
      - clinical
      - patient
      - treatment
      - therapy
      - diagnosis
    computer_science:
      - algorithm
      - machine learning
      - artificial intelligence
      - neural
      - deep learning
      - AI
    physics:
      - quantum
      - physics
      - engineering
      - materials
      - energy
    historical:
      - history
      - historical
      - archive
      - government
      - document
    business:
      - business
      - economics
      - finance
      - management
      - corporate
  domain_categories:
    medical: medical
    computer_science: preprints
    physics: preprints
    historical: historical
    business: business
    general: comprehensive

# Complete source configurations including all built-in and enhanced sources
sources:
  # Enhanced primary sources
  crossref:
    name: crossref
    type: http_api
    enabled: true
    timeout: 45
    max_retries: 5
    cache_expire: 7200
    config:
      description: Primary academic publisher database (enhanced)
      base_url: https://api.crossref.org
      search_path: /works
      query_param: query
      limit_param: rows
      response_format: json
      results_path: message.items
      extra_params:
        sort: relevance
        order: desc
        mailto: research@paperez.org
      field_mappings:
        title: title.0
        authors: author
        doi: DOI
        abstract: abstract
        journal: container-title.0
        year: published-print.date-parts.0.0
        url: URL
        citation_count: is-referenced-by-count
      rate_limit_delay: 0.05

  semantic_scholar:
    name: semantic_scholar
    type: http_api
    enabled: true
    timeout: 60
    max_retries: 3
    cache_expire: 7200
    config:
      description: AI-powered academic search engine (enhanced)
      base_url: https://api.semanticscholar.org/graph/v1
      search_path: /paper/search
      query_param: query
      limit_param: limit
      response_format: json
      results_path: data
      extra_params:
        fields: paperId,title,authors,year,abstract,venue,citationCount,url,openAccessPdf,externalIds
      field_mappings:
        title: title
        authors: authors
        year: year
        abstract: abstract
        journal: venue
        doi: externalIds.DOI
        url: url
        pdf_url: openAccessPdf.url
        citation_count: citationCount
      rate_limit_delay: 0.5

  # Built-in function-based sources
  arxiv:
    name: arxiv
    type: builtin
    enabled: true
    function_name: search_arxiv
    timeout: 30
    max_retries: 3
    cache_expire: 3600
    config:
      description: Preprint repository for STEM fields
      coverage: physics, mathematics, computer science, biology

  pubmed:
    name: pubmed
    type: builtin
    enabled: true
    function_name: search_pubmed
    timeout: 30
    max_retries: 3
    cache_expire: 3600
    config:
      description: Biomedical literature database
      coverage: life sciences, biomedical research

  pubmed_central:
    name: pubmed_central
    type: builtin
    enabled: true
    function_name: search_pubmed_central
    timeout: 30
    max_retries: 3
    cache_expire: 3600
    config:
      description: Full-text biomedical literature repository
      coverage: open access medical and life science articles

  google_scholar:
    name: google_scholar
    type: builtin
    enabled: false  # Disabled by default - requires proxy setup
    function_name: search_google_scholar_fallback
    timeout: 45
    max_retries: 2
    cache_expire: 7200
    config:
      description: Google Scholar fallback search
      coverage: broad academic content across all disciplines

  # HTTP API sources
  europe_pmc:
    name: europe_pmc
    type: http_api
    enabled: true
    timeout: 30
    max_retries: 3
    cache_expire: 3600
    config:
      description: Europe PMC - Life sciences database with 39M+ abstracts
      coverage: biomedical and life sciences literature
      base_url: https://www.ebi.ac.uk/europepmc/webservices/rest
      search_path: /search
      query_param: query
      limit_param: pageSize
      response_format: json
      results_path: resultList.result
      extra_params:
        format: json
        resultType: core
      field_mappings:
        title: title
        authors: authorString
        abstract: abstractText
        journal: journalTitle
        year: pubYear
        doi: doi
        url: fullTextUrlList.fullTextUrl.0.url
        citation_count: citedByCount
      rate_limit_delay: 0.2

  clinicaltrials:
    name: clinicaltrials
    type: http_api
    enabled: true
    timeout: 30
    max_retries: 3
    cache_expire: 3600
    config:
      description: Clinical trials database
      coverage: clinical studies, medical trials
      base_url: https://clinicaltrials.gov/api/v2
      search_path: /studies
      query_param: query.term
      limit_param: pageSize
      response_format: json
      results_path: studies
      extra_params:
        format: json
        fields: NCTId,BriefTitle,OfficialTitle,Condition,Intervention,Phase,StudyType,PrimaryCompletionDate,LastUpdateSubmitDate,LeadSponsorName,OverallStatus,EnrollmentCount,EligibilityCriteria,StudyFirstSubmitDate,BriefSummary
      field_mappings:
        title: protocolSection.identificationModule.briefTitle
        authors: protocolSection.sponsorCollaboratorsModule.leadSponsor.name
        abstract: protocolSection.descriptionModule.briefSummary
        journal: source
        year: protocolSection.statusModule.primaryCompletionDateStruct.date
        url: nctId
        citation_count: "0"
      rate_limit_delay: 0.2

  doaj:
    name: doaj
    type: http_api
    enabled: true
    timeout: 30
    max_retries: 3
    cache_expire: 3600
    config:
      description: Directory of Open Access Journals
      coverage: peer-reviewed open access articles across all subjects
      base_url: https://doaj.org/api/search
      search_path: /articles/_search
      query_param: q
      limit_param: pageSize
      response_format: json
      results_path: results
      field_mappings:
        title: bibjson.title
        authors: bibjson.author
        abstract: bibjson.abstract
        journal: bibjson.journal.title
        year: bibjson.year
        doi: bibjson.identifier.0.id
        url: bibjson.link.0.url
      rate_limit_delay: 0.5

  hathitrust:
    name: hathitrust
    type: http_api
    enabled: true
    timeout: 30
    max_retries: 3
    cache_expire: 7200
    config:
      description: HathiTrust Digital Library - Historical books and documents
      coverage: historical books, government documents, archives
      base_url: https://catalog.hathitrust.org
      search_path: /api/volumes/brief/json
      query_param: q
      limit_param: limit
      response_format: json
      results_path: records
      field_mappings:
        title: title
        authors: author
        year: publishDate
        journal: publisher
        url: url
        abstract: description
      rate_limit_delay: 1.0

  internet_archive:
    name: internet_archive
    type: http_api
    enabled: true
    timeout: 30
    max_retries: 3
    cache_expire: 7200
    config:
      description: Internet Archive - Historical documents and books
      coverage: historical documents, government archives, books
      base_url: https://archive.org
      search_path: /advancedsearch.php
      query_param: q
      limit_param: rows
      response_format: json
      results_path: response.docs
      extra_params:
        output: json
        mediatype: texts
        sort: relevance desc
      field_mappings:
        title: title
        authors: creator
        year: year
        journal: publisher
        url: identifier
        abstract: description
      rate_limit_delay: 0.5

  ssrn:
    name: ssrn
    type: http_api
    enabled: false  # Disabled: SSRN ToS reserves rights for data mining, no public API
    timeout: 30
    max_retries: 3
    cache_expire: 3600
    config:
      description: SSRN - Business, economics, and finance research
      coverage: business research, economics, finance, management, policy
      base_url: https://api.ssrn.com
      search_path: /v1/papers
      query_param: q
      limit_param: limit
      response_format: json
      results_path: papers
      extra_params:
        format: json
        sortBy: relevance
      field_mappings:
        title: title
        authors: authors
        abstract: abstract
        journal: journal
        year: year
        url: ssrnUrl
        pdf_url: pdfUrl
        citation_count: downloads
      rate_limit_delay: 0.3

# Complete categories for all research needs
categories:
  # Enhanced comprehensive search
  comprehensive:
    name: comprehensive
    display_name: Comprehensive Search (Enhanced)
    description: Search across all available sources with optimized settings
    type: standard
    sources:
      - crossref
      - semantic_scholar
      - arxiv
      - pubmed
      - pubmed_central
      - europe_pmc
      - doaj
      - hathitrust
      - internet_archive
      - clinicaltrials
    max_results_per_source: 6
    parallel_search: true

  # High-quality academic sources
  academic_premium:
    name: academic_premium
    display_name: Premium Academic Sources
    description: High-quality peer-reviewed sources for authoritative research
    type: standard
    sources:
      - crossref
      - pubmed
      - semantic_scholar
      - pubmed_central
      - europe_pmc
    max_results_per_source: 8
    parallel_search: true

  # Preprints and latest research
  preprints:
    name: preprints
    display_name: Preprints & Latest Research
    description: Focus on preprint repositories for cutting-edge research
    type: standard
    sources:
      - arxiv
      - semantic_scholar
    max_results_per_source: 8
    parallel_search: true

  # Medical and biomedical research
  medical:
    name: medical
    display_name: Medical & Biomedical Research
    description: Specialized medical and healthcare research
    type: standard
    sources:
      - pubmed
      - pubmed_central
      - clinicaltrials
      - europe_pmc
    max_results_per_source: 8
    parallel_search: true

  # Open access publications
  open_access:
    name: open_access
    display_name: Open Access Publications
    description: Focus on freely available full-text articles
    type: standard
    sources:
      - arxiv
      - pubmed_central
      - semantic_scholar
      - doaj
      - europe_pmc
    max_results_per_source: 6
    parallel_search: true

  # Historical and archival sources
  historical:
    name: historical
    display_name: Historical & Archive Sources
    description: Focus on historical and archival content including government documents
    type: standard
    sources:
      - hathitrust
      - internet_archive
      - crossref
    max_results_per_source: 8
    parallel_search: true

  # Business and economic research
  business:
    name: business
    display_name: Business & Economics Research
    description: Business, economics, finance, and management research
    type: standard
    sources:
      - crossref
      - semantic_scholar
    max_results_per_source: 8
    parallel_search: true

# This is the complete default configuration used by PaperezMCP
# Features:
# - All built-in sources included and properly configured
# - Enhanced performance settings (higher concurrency, longer cache)
# - Optimized source configurations with improved timeouts and rate limits
# - Complete query routing for automatic category selection
# - Production-ready categories for different research needs
#
# User Override:
# - Users can override any setting by placing config.yaml in their .paperez directory
# - Same-name sources/categories in user config will completely replace these defaults
# - Use use_default_sources: false to disable all sources and start fresh