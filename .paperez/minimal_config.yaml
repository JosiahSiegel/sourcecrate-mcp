# PaperezMCP Minimal Default Configuration
# Truly minimal configuration with just one reliable source
# This serves as the MCP server's minimal fallback option

# Minimal global settings
version: "1.0"
default_category: minimal
max_concurrent_searches: 3  # Very low concurrency
global_cache_enabled: true
global_cache_expire: 1800  # Short cache duration (30 minutes)
default_output_dir: .paperez
cleanup_temp_files: true

# Disable all sources except arXiv
use_default_sources: false

# Single reliable source configuration
sources:
  # arXiv - Reliable, open, no API key required
  arxiv:
    name: arxiv
    type: builtin
    enabled: true
    timeout: 30
    max_retries: 2
    cache_expire: 3600
    config:
      description: Preprint repository for STEM fields (minimal setup)
      coverage: physics, mathematics, computer science, biology

# Single minimal category
categories:
  minimal:
    name: minimal
    display_name: Minimal Search
    description: Single source search using arXiv preprints
    type: standard
    sources:
      - arxiv
    max_results_per_source: 10
    parallel_search: false  # No parallelism needed for single source

# This minimal configuration provides:
# - Single reliable source (arXiv)
# - Minimal resource usage
# - No API keys or authentication required
# - Simple, fast startup
# - Suitable for basic STEM research needs