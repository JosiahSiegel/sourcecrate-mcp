name: Publish tested MCP release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/test-mcp-install.yml
  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check tag matches package and configuration
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); if(process.env.GITHUB_REF_NAME !== 'v'+p.version || !fs.readFileSync('mcp-config.json','utf8').includes('/v'+p.version+'/')) process.exit(1)"
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist
      - name: Publish tested distribution and portable agent configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* mcp-config.json --verify-tag --generate-notes --title "SourceCrate $GITHUB_REF_NAME"
