name: Test MCP installation and functionality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: 'pdf/tools.py.lock'
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run test:pdf
      - name: Test packaged installation outside checkout
        run: npm run test:install
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: distribution
          path: sourcecrate-mcp-*.tgz
