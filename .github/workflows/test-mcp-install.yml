name: Test MCP installation and functionality
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev --extra http
      - run: uv run --locked python scripts/validate_code_quality.py
      - run: uv run --locked pytest -q
      - run: uv build
      - name: Test installed CLI and MCP protocol outside checkout
        run: |
          wheel="$(python -c 'import glob; print(glob.glob("dist/*.whl")[0])')"
          uvx --python "${{ matrix.python }}" --from "$wheel" sourcecrate --help
          uvx --python "${{ matrix.python }}" --from "$wheel" sourcecrate --version
          uv run --no-project --python "${{ matrix.python }}" --with "$wheel" python scripts/smoke_installed_mcp.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          name: distribution
          path: dist/
