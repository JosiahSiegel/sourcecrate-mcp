name: Test MCP Installation and Functionality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-mcp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13']

    env:
      PYTHONIOENCODING: utf-8
      PYTHONLEGACYWINDOWSSTDIO: utf-8

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Configure Windows console encoding
      if: runner.os == 'Windows'
      run: |
        chcp 65001

    - name: Install uv and uvx (Unix)
      if: runner.os != 'Windows'
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install uv and uvx (Windows)
      if: runner.os == 'Windows'
      run: |
        powershell -c "irm https://astral.sh/uv/install.ps1 | iex"
        echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Verify UV installation (Unix)
      if: runner.os != 'Windows'
      run: |
        # Wait for PATH to update and verify uv/uvx are available
        echo "Current PATH: $PATH"
        which uv || echo "uv not found in PATH"
        which uvx || echo "uvx not found in PATH"

        # Try direct path
        $HOME/.cargo/bin/uv --version || echo "Direct uv path failed"
        $HOME/.cargo/bin/uvx --version || echo "Direct uvx path failed"

    - name: Verify UV installation (Windows)
      if: runner.os == 'Windows'
      run: |
        # Check for uv/uvx in Windows
        where uv || echo "uv not found in PATH"
        where uvx || echo "uvx not found in PATH"

        # Try direct path if PATH isn't updated yet
        if (Test-Path "$env:USERPROFILE\.cargo\bin\uv.exe") {
          & "$env:USERPROFILE\.cargo\bin\uv.exe" --version
        } else {
          echo "Direct uv path failed"
        }

        if (Test-Path "$env:USERPROFILE\.cargo\bin\uvx.exe") {
          & "$env:USERPROFILE\.cargo\bin\uvx.exe" --version
        } else {
          echo "Direct uvx path failed"
        }

    - name: Test MCP Installation and Server Startup via uvx (Unix)
      if: runner.os != 'Windows'
      run: |
        # Test uvx installation and verify package can be invoked
        if command -v uvx >/dev/null 2>&1; then
          echo "✓ Testing uvx installation..."
          # Test that the package installs and responds to --help
          uvx --from . paperez-mcp --help > /dev/null
          echo "✓ uvx installation working"
        elif [ -f "$HOME/.cargo/bin/uvx" ]; then
          echo "✓ Testing direct uvx path..."
          # Test that the package installs and responds to --help
          "$HOME/.cargo/bin/uvx" --from . paperez-mcp --help > /dev/null
          echo "✓ Direct uvx path working"
        else
          echo "❌ uvx not available - this is required for user installation"
          exit 1
        fi

    - name: Test MCP Installation and Server Startup via uvx (Windows)
      if: runner.os == 'Windows'
      run: |
        # Test uvx installation and verify package can be invoked
        if (Get-Command uvx -ErrorAction SilentlyContinue) {
          echo "✓ Testing uvx installation..."
          # Test that the package installs and responds to --help
          uvx --from . paperez-mcp --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "uvx installation test failed" }
          echo "✓ uvx installation working"
        } elseif (Test-Path "$env:USERPROFILE\.cargo\bin\uvx.exe") {
          echo "✓ Testing direct uvx path..."
          # Test that the package installs and responds to --help
          & "$env:USERPROFILE\.cargo\bin\uvx.exe" --from . paperez-mcp --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Direct uvx installation test failed" }
          echo "✓ Direct uvx path working"
        } else {
          echo "❌ uvx not available - this is required for user installation"
          exit 1
        }

    - name: Install all dependencies (core + PDF + dev)
      run: |
        # Install ALL core dependencies (including missing ones caught by validation)
        python -m pip install fastmcp scholarly httpx aiohttp requests tenacity diskcache asyncio-throttle fake-useragent arxiv pymed semanticscholar free-proxy

        # Install PDF processing dependencies (required for MCP server)
        python -m pip install PyMuPDF pymupdf4llm pdfplumber lxml beautifulsoup4

        # Install development dependencies (required for validation)
        python -m pip install pytest pytest-asyncio black ruff mypy types-PyYAML types-requests types-beautifulsoup4

        # Test direct module import
        python -c "import sys; sys.path.insert(0, '.'); from paperez_mcp import server; print('✓ Direct server import successful')"

    - name: Validate dependencies using shared script
      run: |
        python scripts/validate_dependencies.py

    - name: Validate code quality using shared script
      run: |
        python scripts/validate_code_quality.py

    - name: Test configuration loading
      run: |
        python -c "
        from paperez_mcp.config.manager import ConfigManager
        config = ConfigManager().get_config()
        print(f'Loaded {len(config.sources)} sources and {len(config.categories)} categories')
        assert len(config.sources) > 0, 'No sources loaded'
        assert len(config.categories) > 0, 'No categories loaded'
        print('✓ Configuration loading successful')
        "

    - name: Validate imports and functionality using shared script
      run: |
        python scripts/validate_imports.py

    - name: Test PDF processing capabilities (Unix)
      if: runner.os != 'Windows'
      run: |
        python -c "
        import tempfile
        import os
        from pathlib import Path

        # Test PDF processing imports
        try:
            import pymupdf4llm
            import PyMuPDF
            print('✓ PDF processing dependencies available')
        except ImportError as e:
            print(f'❌ PDF processing dependencies missing: {e}')
            raise

        # Create a minimal test
        from paperez_mcp.utils.pdf_processor import extract_pdf_text_from_local_file
        print('✓ PDF processor functions available')
        "

    - name: Test PDF processing capabilities (Windows)
      if: runner.os == 'Windows'
      run: |
        python -c "
        import tempfile
        import os
        from pathlib import Path

        # Test PDF processing imports
        try:
            import pymupdf4llm
            import PyMuPDF
            print('✓ PDF processing dependencies available')
        except ImportError as e:
            print(f'❌ PDF processing dependencies missing: {e}')
            raise

        # Create a minimal test
        from paperez_mcp.utils.pdf_processor import extract_pdf_text_from_local_file
        print('✓ PDF processor functions available')
        "

    - name: Test configuration validation (CI-friendly)
      run: |
        python tests/test_config_validation_ci.py

    - name: Test basic search functionality (mock mode)
      run: |
        python -c "
        import sys
        sys.path.insert(0, '.')
        from paperez_mcp.utils.query_intent import QueryIntentDetector
        from paperez_mcp.config.manager import ConfigManager

        # Test query intent detector
        detector = QueryIntentDetector()
        analysis = detector.analyze_query('machine learning neural networks')
        print(f'✓ Query analysis successful: {analysis.intent}')

        # Test configuration-based search setup
        config = ConfigManager().get_config()
        print(f'✓ Found {len(config.sources)} sources for testing')

        # Basic validation that we can instantiate search services
        from paperez_mcp.services.search_service import SearchOrchestrationService
        search_service = SearchOrchestrationService()
        print('✓ Search orchestration service initialized')
        "

    - name: Test MCP server startup (basic validation) (Unix)
      if: runner.os != 'Windows'
      run: |
        timeout 30s python -c "
        import asyncio
        import signal
        import sys
        sys.path.insert(0, '.')

        async def test_server_startup():
            try:
                # Import and test basic MCP server setup
                from paperez_mcp.server import mcp
                print('✓ MCP server module loaded successfully')

                # Test that tools are properly registered
                tools = await mcp.get_tools()
                expected_tools = [
                    'browse_papers', 'download_papers', 'convert_pdf_to_text',
                    'convert_pdf_to_markdown', 'batch_convert_pdfs', 'get_status', 'get_help'
                ]

                tool_names = [tool['name'] for tool in tools]
                for expected in expected_tools:
                    assert expected in tool_names, f'Missing tool: {expected}'

                print(f'✓ All {len(expected_tools)} MCP tools registered correctly')
                return True

            except Exception as e:
                print(f'❌ Server startup test failed: {e}')
                import traceback
                traceback.print_exc()
                return False

        result = asyncio.run(test_server_startup())
        if not result:
            print('❌ MCP server startup validation failed')
            sys.exit(1)
        print('✓ MCP server startup validation passed')
        "

    - name: Test MCP server startup (basic validation) (Windows)
      if: runner.os == 'Windows'
      run: |
        python -c "
        import asyncio
        import sys
        sys.path.insert(0, '.')

        async def test_server_startup():
            try:
                # Import and test basic MCP server setup
                from paperez_mcp.server import mcp
                print('✓ MCP server module loaded successfully')

                # Test that tools are properly registered
                tools = await mcp.get_tools()
                expected_tools = [
                    'browse_papers', 'download_papers', 'convert_pdf_to_text',
                    'convert_pdf_to_markdown', 'batch_convert_pdfs', 'get_status', 'get_help'
                ]

                tool_names = [tool['name'] for tool in tools]
                for expected in expected_tools:
                    assert expected in tool_names, f'Missing tool: {expected}'

                print(f'✓ All {len(expected_tools)} MCP tools registered correctly')
                return True

            except Exception as e:
                print(f'❌ Server startup test failed: {e}')
                import traceback
                traceback.print_exc()
                return False

        result = asyncio.run(test_server_startup())
        if result:
            print('✓ MCP server startup validation passed')
        "

    - name: Run comprehensive tests
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Test status and help tools (offline mode)
      run: |
        python -c "
        import asyncio
        import sys
        sys.path.insert(0, '.')
        from paperez_mcp.server import get_status, get_help

        async def test_tools():
            # Test get_status (should work offline)
            status = await get_status()
            print('✓ get_status tool working')
            assert 'api_status' in status

            # Test get_help (should always work)
            try:
                help_info = await get_help()
                print('✓ get_help tool working')
                assert 'config_guide' in help_info
            except Exception as e:
                print(f'❌ get_help failed: {e}')
                raise

        asyncio.run(test_tools())
        "

    - name: Test MCP Tools with Realistic Scenarios (Platform-Specific)
      run: |
        python -c "
        import asyncio
        import sys
        import os
        import tempfile
        from pathlib import Path
        sys.path.insert(0, '.')
        from paperez_mcp.server import browse_papers, get_status, get_help

        async def test_comprehensive_tools():
            print('🧪 Testing MCP tools with realistic scenarios...')

            # Test browse_papers with a simple query
            print('  📚 Testing browse_papers with basic query...')
            result = await browse_papers('test query', limit=2)
            print(f'  ✓ browse_papers returned {len(result)} results')
            assert isinstance(result, list), 'browse_papers should return a list'

            # Test get_status comprehensive response
            try:
                print('  📊 Testing get_status comprehensive response...')
                status = await get_status()
                assert 'api_status' in status, 'Missing api_status'
                assert 'config' in status, 'Missing config'
                assert 'cache_stats' in status, 'Missing cache_stats'
                print('  ✓ get_status returned all required fields')
            except Exception as e:
                print(f'  ❌ get_status comprehensive test failed: {e}')
                raise

            # Test get_help comprehensive response
            try:
                print('  📖 Testing get_help comprehensive response...')
                help_info = await get_help()
                assert 'config_guide' in help_info, 'Missing config_guide'
                assert 'file_paths' in help_info, 'Missing file_paths'
                assert 'examples' in help_info, 'Missing examples'
                print('  ✓ get_help returned all required fields')
            except Exception as e:
                print(f'  ❌ get_help comprehensive test failed: {e}')
                raise

            # Test file path handling (platform-specific)
            try:
                print('  📁 Testing file path handling...')
                with tempfile.TemporaryDirectory() as temp_dir:
                    test_path = Path(temp_dir) / 'test_file.txt'
                    test_path.write_text('test content', encoding='utf-8')

                    # Verify file operations work correctly on this platform
                    assert test_path.exists(), 'Test file creation failed'
                    content = test_path.read_text(encoding='utf-8')
                    assert content == 'test content', 'File content mismatch'

                    print(f'  ✓ File operations working correctly on {os.name} platform')
            except Exception as e:
                print(f'  ❌ File path handling test failed: {e}')
                raise

            print('🎉 All comprehensive tool tests passed!')

        asyncio.run(test_comprehensive_tools())
        "

    - name: Test Error Handling and Edge Cases
      run: |
        python -c "
        import asyncio
        import sys
        sys.path.insert(0, '.')
        from paperez_mcp.server import browse_papers, download_papers

        async def test_error_handling():
            print('🚨 Testing error handling and edge cases...')

            # Test with empty query (should handle gracefully)
            print('  📝 Testing browse_papers with empty query...')
            result = await browse_papers('', limit=1)
            assert isinstance(result, list), 'Empty query should still return a list'
            print(f'  ✓ Empty query handled correctly (returned {len(result)} results)')

            # Test with large limit (should handle gracefully)
            print('  📊 Testing browse_papers with large limit...')
            result = await browse_papers('test', limit=100)
            assert isinstance(result, list), 'Large limit should still return a list'
            print(f'  ✓ Large limit handled correctly (returned {len(result)} results)')

            # Test with special characters (should handle gracefully)
            print('  🔤 Testing browse_papers with special characters...')
            result = await browse_papers('test & special <chars>', limit=1)
            assert isinstance(result, list), 'Special characters should still return a list'
            print(f'  ✓ Special characters handled correctly (returned {len(result)} results)')

            print('🛡️  Error handling tests completed!')

        asyncio.run(test_error_handling())
        "

    - name: Summary
      run: |
        echo "=== Comprehensive MCP Test Summary ==="
        echo "✅ MCP installation via uvx: VERIFIED"
        echo "✅ Code compilation and linting: STRICT (no warnings ignored)"
        echo "✅ Configuration loading: VERIFIED"
        echo "✅ Core imports and dependencies: VERIFIED"
        echo "✅ PDF processing capabilities: REQUIRED (fails if missing)"
        echo "✅ MCP server startup: VERIFIED"
        echo "✅ All MCP tools registration: VERIFIED"
        echo "✅ Tool functionality with realistic scenarios: TESTED"
        echo "✅ Error handling and edge cases: TESTED"
        echo "✅ Platform-specific file operations: TESTED"
        echo ""
        echo "🎯 Platform: ${{ matrix.os }}"
        echo "🐍 Python: ${{ matrix.python-version }}"
        echo "📋 Test Quality: STRICT (no false positives or excuses)"
        echo "🚀 Status: ALL COMPREHENSIVE TESTS PASSED ✅"