# Philosophy Research Configuration
# Sources and categories for philosophy, ethics, and related humanities scholarship

# ⚠️ IMPORTANT - LIMITED FREE COVERAGE:
# Philosophy research is significantly under-represented in free/open-access databases.
# Comprehensive philosophy research requires subscription databases:
# - JSTOR (major humanities database)
# - PhilPapers (philosophy-specific database)
# - Project MUSE (humanities and social sciences journals)
# - Philosopher's Index (specialized philosophy database)
#
# The free sources below provide minimal coverage with accessible PDFs.
# Most core philosophy journals require institutional access.
#
# For comprehensive philosophy research, users should create custom configurations
# with institutional database access. Call get_help() for guidance on adding
# custom sources with authentication.

# 🔑 FREE API KEY SOURCES - OPTIONAL BUT RECOMMENDED:
# The sources below require free API keys but significantly improve philosophy coverage.
# They are DISABLED by default - enable them if you want better results.

sources:
  core_repository:
    name: core_repository
    type: http_api
    enabled: false  # DISABLED - Requires free API key (instructions below)
    timeout: 30
    max_retries: 3
    cache_expire: 7200
    config:
      description: |
        CORE Repository - 9.5M+ open access papers including humanities

        🔑 FREE API KEY REQUIRED (2-3 minutes to sign up)
        Get your free key at: https://core.ac.uk/services/api

        ✅ WHY ENABLE THIS:
        - Significantly better humanities/philosophy coverage than free sources
        - 9.5M+ open access papers across all disciplines
        - Includes historical philosophy papers
        - Free tier: 10 requests/minute (sufficient for most research)

        📝 TO ENABLE:
        1. Visit https://core.ac.uk/services/api and sign up (free)
        2. Copy your API key
        3. In your custom .paperez/config/philosophy.yaml:
           - Set: enabled: true
           - Add: api_key: YOUR_KEY_HERE (in extra_params section)

        💡 ALTERNATIVE: Keep disabled if you prefer to avoid API key signup.
        Default sources (OpenAlex, CrossRef) will still work but with limited coverage.
      coverage: comprehensive multidisciplinary including humanities, philosophy, history
      base_url: https://api.core.ac.uk/v3
      search_path: /search/works
      query_param: q
      limit_param: limit
      response_format: json
      results_path: results
      extra_params:
        # api_key: YOUR_KEY_HERE  # Uncomment and add your key to enable
      field_mappings:
        title: title
        authors: authors
        abstract: abstract
        journal: publisher
        year: publishedDate
        doi: doi
        url: id
        citation_count: citationCount
        pdf_url: downloadUrl
      rate_limit_delay: 6.0  # 10 requests/minute on free tier
      # NOTE: CORE is completely free, no payment required
      # API documentation: https://core.ac.uk/documentation/api
      # Rate limits: https://core.ac.uk/services/api (10 req/min free tier)

categories:
  philosophy:
    name: philosophy
    display_name: Philosophy Research
    description: |
      Philosophy, ethics, metaphysics, epistemology, logic, moral philosophy

      ⚠️ LIMITED FREE COVERAGE: Philosophy research typically requires
      subscription databases (JSTOR, PhilPapers, Project MUSE, Philosopher's Index).
      Free sources provide minimal coverage with accessible PDFs.

      Most core philosophy journals (Mind, Journal of Philosophy, Philosophical Review,
      Ethics, etc.) require institutional subscriptions and are not available through
      free academic APIs.

      For comprehensive philosophy research, create a custom config with institutional
      database access (call get_help() for guidance).
    type: standard
    sources:
      - openalex  # General academic index, limited philosophy coverage
      - crossref  # DOI registry, limited open access philosophy
      - eric  # Education database, some philosophy of education papers
      - osf_preprints  # Small volume of philosophy preprints
      # - core_repository  # OPTIONAL: Significantly better coverage, requires free API key (see sources section above)
    max_results_per_source: 10
    parallel_search: true

# KNOWN LIMITATIONS FOR PHILOSOPHY RESEARCH:
#
# 1. MINIMAL OPEN ACCESS: Most philosophy journals do not offer open access
#    - Core journals (Mind, JP, Phil Review, etc.) behind paywalls
#    - Philosophy has lower open access adoption than STEM fields
#
# 2. PREPRINT CULTURE: Philosophy has minimal preprint culture compared to STEM
#    - arXiv philosophy section is very small
#    - PhilSci-Archive exists but not integrated (no public API)
#
# 3. BOOK-BASED DISCIPLINE: Much philosophy scholarship published as books
#    - University presses (Oxford, Cambridge, Harvard, etc.)
#    - Not indexed in paper-focused databases
#
# 4. SPECIALIZED SOURCES NEEDED:
#    - PhilPapers: 2.5M+ entries, philosophy-specific (requires subscription)
#    - JSTOR: Essential for historical philosophy research (requires subscription)
#    - Project MUSE: Humanities journals (requires subscription)
#    - Philosopher's Index: Bibliography database (requires subscription)
#
# RECOMMENDATION FOR AI USERS:
# When users request philosophy research and get poor results (0-5 papers, wrong discipline):
#
# 1. PROACTIVELY RECOMMEND CORE REPOSITORY:
#    - Explain that CORE (free API key) significantly improves philosophy coverage
#    - Provide signup link: https://core.ac.uk/services/api
#    - Emphasize it's FREE and takes 2-3 minutes
#    - Create custom config with CORE enabled if user agrees
#
# 2. EXPLAIN THE TRADE-OFF:
#    - Default sources (no API key): Limited coverage, 0-5 results
#    - CORE (free API key): Significantly better humanities coverage
#    - User decides if 2-3 min signup is worth better results
#
# 3. OFFER INSTITUTIONAL ACCESS:
#    - For truly comprehensive research, recommend JSTOR/PhilPapers with institutional access
#    - Call get_help() for guidance on adding authenticated sources
#
# EXPECTED BEHAVIOR:
# - Without CORE: 0-5 papers, mostly interdisciplinary (philosophy of science, philosophy of education)
# - With CORE: 10-30 papers, better humanities/philosophy coverage
# - With institutional (JSTOR/PhilPapers): Comprehensive coverage
#
# This is a realistic domain constraint - philosophy research genuinely needs specialized sources.
