# PaperezMCP Base Configuration
# Core settings, routing, and general configuration options
# Sources and categories are organized by research domain in separate files:
# - medical.yaml, scientific.yaml, business.yaml, historical.yaml
# - social-sciences.yaml, humanities.yaml, legal.yaml, government.yaml

# TERMS OF SERVICE COMPLIANCE NOTES:
# - All sources use legitimate public APIs designed for academic research
# - All default sources verified for ToS compliance and API availability as of January 7, 2025
# - API testing completed January 7, 2025 to confirm JSON/XML API availability
#
# ENABLED SOURCES (API verified):
# - CrossRef: Requires email in requests (configured via mailto param)
# - Semantic Scholar: 1 RPS rate limit, attribution required for publications
# - arXiv: 1 request per 3 seconds, CC0 metadata license
# - PubMed/PMC: NCBI rate limits (3 RPS without API key), email registration recommended
# - Europe PMC: Privacy notice agreement, ~10 request limit
# - ClinicalTrials.gov: US Government database, ~50 requests/minute, public domain
# - DOAJ: 2 requests/second, CC BY-SA for journals, CC0 for articles
# - HathiTrust: Small-scale queries only, not for bulk retrieval
# - Internet Archive: ~1 RPS, non-commercial use only
# - bioRxiv/medRxiv: Free, date-range API, 100 results per page (API tested ✅)
# - ChemRxiv: Open API compatible, keyword search (API tested ✅)
# - OSF Preprints: Open Science Framework API, includes SocArXiv/PsyArXiv/EarthArXiv (API tested ✅)
# - Fatcat/Internet Archive Scholar: Open API, 35M+ papers (⚠️ intermittent connectivity issues)
# - OpenAlex: Polite pool requires email (mailto param), free, no API key
#
# DISABLED SOURCES (no usable API):
# - Google Scholar: Disabled (no official API)
# - SSRN: Disabled (ToS reserves data mining rights, restricted API access)
# - ResearchGate: Disabled (no public API, ToS prohibits automated extraction)
# - ERIC: Disabled (no JSON/XML API - only HTML web interface, API testing Jan 7, 2025)
#
# REQUIRES API KEY (optional):
# - CORE: Available but requires free API key registration (core.ac.uk/services/api)

# Version and basic settings
version: "1.0"
default_category: null  # Use intelligent BM25 routing (cascade through all sources)
max_concurrent_searches: 15  # Higher concurrency for comprehensive setup
global_cache_enabled: true
global_cache_expire: 7200  # Longer cache for comprehensive setup
default_output_dir: .paperez
cleanup_temp_files: true

# User control options
use_default_sources: true  # Set to false in user config to disable all built-in sources

