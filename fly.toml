# fly.toml app configuration file generated for sourcecrate on 2025-10-05T17:31:51-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sourcecrate'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.flyio'

[deploy]
  strategy = 'rolling'
  wait_timeout = '10m0s'

[env]
  PORT = '8080'
  PYTHONUNBUFFERED = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 10

[[vm]]
  size = 'shared-cpu-2x'

[[statics]]
  guest_path = '/app/browser-ui'
  url_prefix = '/'
