# FastMCP Cloud Deployment Configuration
# Enhanced Scholarly MCP Server with Full-Text Retrieval

name: scholarly-enhanced-mcp-server
description: Enhanced MCP server with full-text retrieval capabilities for academic papers
version: "1.0.0"
entrypoint: scholarly_enhanced_server.py:mcp
python_version: "3.11"

# Core dependencies for enhanced functionality
dependencies:
  - fastmcp>=2.6.0
  - scholarly>=1.7.11
  - httpx>=0.25.0
  - aiohttp>=3.8.0
  - requests>=2.28.0
  - PyMuPDF>=1.23.0
  - pdfplumber>=0.10.0
  - lxml>=4.9.0
  - asyncio-throttle>=1.0.2

# Environment variables (set these in FastMCP Cloud dashboard)
env:
  # API Keys (optional but recommended for higher rate limits)
  # SEMANTIC_SCHOLAR_API_KEY: "your_semantic_scholar_key"
  # CORE_API_KEY: "your_core_api_key"

  # Email for Unpaywall API (required)
  UNPAYWALL_EMAIL: "your_email@example.com"

  # PDF Processing Configuration
  MAX_PDF_SIZE_MB: "50"
  PDF_TIMEOUT: "60"

  # Caching Configuration
  ENABLE_CACHING: "false"
  CACHE_TTL_HOURS: "24"

  # Proxy Configuration (optional)
  PROXY_TYPE: "none"  # Options: none, free, scraperapi, luminati, single

  # Rate Limiting
  RATE_LIMIT_DELAY: "1.0"

# Resource allocation for PDF processing
resources:
  memory: "1GB"
  cpu: "1.0"

# Health check configuration
health_check:
  path: "/health"
  timeout: 30

# Logging configuration
logging:
  level: "INFO"

# Features and capabilities
features:
  - "Academic paper search via Google Scholar"
  - "Multi-source open access detection"
  - "Full-text PDF extraction"
  - "arXiv integration"
  - "Semantic Scholar API integration"
  - "Unpaywall database access"
  - "BibTeX citation generation"
  - "Author profile retrieval"
  - "Citation analysis"
  - "Rate limiting and error handling"

# Tags for discovery
tags:
  - "academic"
  - "research"
  - "papers"
  - "scholar"
  - "pdf"
  - "full-text"
  - "open-access"
  - "arxiv"
  - "citations"