# Social Sciences Research Configuration
# Sources and categories for psychology, sociology, education, anthropology, and related fields

# Currently minimal social sciences sources - needs expansion with specialized databases
# This file provides initial sources and highlights remaining gaps

sources:
  eric:
    name: eric
    type: http_api
    enabled: true
    timeout: 30
    max_retries: 3
    cache_expire: 3600
    config:
      description: ERIC - Education Resources Information Center (FREE US Dept of Education database, no auth required)
      coverage: education, pedagogy, learning, teaching, educational policy, 1.7M+ records
      base_url: https://api.ies.ed.gov/eric
      search_path: /
      query_param: search
      limit_param: rows
      response_format: json
      results_path: response.docs
      extra_params:
        format: json
      field_mappings:
        title: title
        authors: author
        abstract: description
        journal: publisher
        year: publicationdateyear
        doi: ""  # ERIC doesn't use DOIs
        url: id  # ERIC ID (e.g., "ED465027")
        citation_count: "0"  # ERIC doesn't provide citation counts
        pdf_url: ""  # ERIC doesn't provide direct PDF URLs in API
      rate_limit_delay: 0.5
      # NOTE: ERIC is completely free, US government database
      # 1.7M+ records since 1966 (educational research)
      # API endpoint: https://api.ies.ed.gov/eric/
      # API docs: https://eric.ed.gov/?api (OpenAPI/Swagger spec)
      # Supports JSON, XML, CSV response formats
      # Max 2000 rows per request, default 20
      # Example: https://api.ies.ed.gov/eric/?search=learning&format=json&rows=20
      # API testing: January 7, 2025 - Fully functional ✅
    capabilities:
      medical_focus: false
      stem_focus: false
      humanities_focus: false
      social_science_focus: true
      preprint_server: false
      field_search: true
      phrase_search: true
      boolean_search: true
      wildcard_search: true
      high_pdf_availability: false
      open_access_only: false
      subscription_content: true
      prefers_simple_queries: false
      prefers_natural_language: true
      prefers_quoted_phrases: true
      historical_depth: very_high
      update_frequency: monthly
      average_response_time: 2.0
      pdf_validation_required: true
      search_priority: 8
      topic_routing_weight: 1.3

  osf_preprints:
    name: osf_preprints
    type: http_api
    enabled: true
    timeout: 30
    max_retries: 3
    cache_expire: 3600
    config:
      description: OSF Preprints - Open Science Framework preprint aggregator (FREE, includes SocArXiv, PsyArXiv, EarthArXiv, no auth required)
      coverage: social sciences, psychology, earth sciences, multidisciplinary
      base_url: https://api.osf.io/v2
      search_path: /preprints
      query_param: filter[subjects]
      limit_param: page[size]
      response_format: json
      results_path: data
      field_mappings:
        title: attributes.title
        authors: relationships.contributors
        doi: links.preprint_doi
        abstract: attributes.description
        journal: relationships.provider.data.id
        year: attributes.date_published
        url: links.html
        citation_count: "0"
        pdf_url: links.download
      rate_limit_delay: 0.5
      # NOTE: OSF API is completely free
      # Covers multiple preprint servers: SocArXiv (sociology), PsyArXiv (psychology),
      # EarthArXiv (earth sciences), and many more
      # API docs: https://developer.osf.io/
    capability_profile: preprint

  core_repository:
    name: core_repository
    type: http_api
    enabled: false  # DISABLED: Requires API key registration - register at core.ac.uk/services/api
    disabled_reason: "Requires API key registration - register at core.ac.uk/services/api"
    timeout: 30
    max_retries: 3
    cache_expire: 3600
    config:
      description: "CORE - Open access research aggregator (REQUIRES API KEY: Register at core.ac.uk/services/api with email to get free API key)"
      coverage: psychology, education, sociology, political science, economics
      base_url: https://api.core.ac.uk/v3
      search_path: /search/works
      query_param: q
      limit_param: limit
      response_format: json
      results_path: results
      extra_params:
        # api_key: "YOUR_API_KEY_HERE"  # Get from core.ac.uk/services/api
      auth_type: ApiKey  # API key authentication
      api_key_param: api_key  # Pass API key as query parameter
      field_mappings:
        title: title
        authors: authors
        abstract: abstract
        journal: publisher
        year: yearPublished
        doi: doi
        url: downloadUrl
        citation_count: citationCount
      rate_limit_delay: 1.0  # Conservative rate limit (5 requests per 10 seconds for free tier)
      # NOTE: Rate limits for free tier:
      # - One batch request or five single requests per 10 seconds
      # - Registered users get better performance
      # - Supporting/Sustaining Members get faster rates
      # Instructions:
      # 1. Go to core.ac.uk/services/api
      # 2. Register with your email (institutional email preferred)
      # 3. Check email for API key
      # 4. Add API key to extra_params.api_key field above
      # 5. Set enabled: true

  openalex:
    name: openalex
    type: http_api
    enabled: true
    timeout: 30
    max_retries: 3
    cache_expire: 7200
    config:
      description: Open catalog with extensive social sciences coverage
      coverage: comprehensive multidisciplinary including social sciences
      base_url: https://api.openalex.org
      search_path: /works
      query_param: search
      limit_param: per-page
      response_format: json
      results_path: results
      extra_params:
        mailto: research@paperez.org
      field_mappings:
        title: title
        authors: authorships
        abstract: abstract_inverted_index
        journal: primary_location.source.display_name
        year: publication_year
        doi: doi
        url: primary_location.landing_page_url
        pdf_url: open_access.oa_url
        citation_count: cited_by_count
      rate_limit_delay: 0.1

categories:
  social_sciences:
    name: social_sciences
    display_name: Social Sciences Research
    description: Psychology, sociology, education, anthropology, and political science
    type: standard
    sources:
      - eric
      - osf_preprints
      # - core_repository  # DISABLED: Requires API key registration
      - openalex
      - semantic_scholar  # From scientific.yaml - has good social sciences coverage
    max_results_per_source: 6
    parallel_search: true

  education:
    name: education
    display_name: Education Research
    description: Education, pedagogy, learning sciences, educational policy
    type: standard
    sources:
      - eric  # Primary education research database
      - osf_preprints  # Includes education-related preprints
      - openalex
      - semantic_scholar
    max_results_per_source: 6
    parallel_search: true

  psychology_research:
    name: psychology_research
    display_name: Psychology Research
    description: Psychology, cognitive science, behavioral research
    type: standard
    sources:
      - osf_preprints  # PsyArXiv via OSF
      - semantic_scholar
      - openalex
    max_results_per_source: 6
    parallel_search: true

