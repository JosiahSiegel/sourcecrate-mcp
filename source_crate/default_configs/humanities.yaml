# Humanities Research Configuration
# Sources and categories for literature, philosophy, arts, languages, and cultural studies

# Currently minimal humanities sources - needs expansion with specialized databases
# This file provides initial sources and highlights remaining gaps

sources:
  openlibrary:
    name: openlibrary
    type: http_api
    enabled: true
    timeout: 30
    max_retries: 3
    cache_expire: 7200
    config:
      description: Open Library - Internet Archive's book database with humanities focus
      coverage: literature, philosophy, history, cultural studies, language, arts
      base_url: https://openlibrary.org
      search_path: /search.json
      query_param: q
      limit_param: limit
      response_format: json
      results_path: docs
      extra_params:
        fields: title,author_name,first_publish_year,publisher,subject,isbn,key
      field_mappings:
        title: title
        authors: author_name
        abstract: subject
        journal: publisher
        year: first_publish_year
        url: key
        citation_count: "0"
      rate_limit_delay: 1.0

categories:
  humanities:
    name: humanities
    display_name: Humanities Research
    description: Literature, philosophy, arts, cultural studies, and languages
    type: standard
    sources:
      - openlibrary
      # - core_repository  # DISABLED: Requires API key registration
    max_results_per_source: 8
    parallel_search: true

# MAJOR GAPS IDENTIFIED - NEED MORE SPECIALIZED SOURCES:
# - JSTOR (major humanities database - requires subscription)
# - Project MUSE (humanities and social sciences - requires subscription)
# - MLA International Bibliography (literature and language - requires subscription)
# - Philosopher's Index (philosophy - requires subscription)
# - Art Index/Art Abstracts (art history - requires subscription)
# - Music Index (musicology - requires subscription)
# - Film & Television Literature Index (media studies - requires subscription)
# - Historical Abstracts (history - requires subscription)
# - Religious and Theological Abstracts (religious studies - requires subscription)
# - Classical studies databases (classics - requires subscription)
# - Medieval studies sources (medieval history - requires subscription)
# - Renaissance studies (Renaissance history - requires subscription)
# - Modern language databases (linguistics - requires subscription)
# - Comparative literature sources (literature - requires subscription)
# - Cultural studies databases (cultural studies - requires subscription)
# - Digital humanities repositories (varies by repository)
# - Museum and gallery databases (art history - varies by institution)
# - Theater and performance studies (performing arts - requires subscription)
# - Creative writing repositories (creative writing - varies by repository)
#
# ⚠️ FUNDAMENTAL LIMITATION: Humanities research requires subscription databases
#
# ISSUE: Humanities under-resourced with only 2 free sources (Open Library + CORE Repository)
# Priority: HIGH - Major academic discipline needs more specialized sources
#
# WHY FREE SOURCES ARE INSUFFICIENT:
# 1. Lower Open Access Adoption: Humanities has significantly lower OA publishing rates than STEM
# 2. Book-Based Scholarship: Much humanities research published as books, not papers
# 3. Minimal Preprint Culture: Humanities lacks robust preprint servers (unlike arXiv for STEM)
# 4. Journal Business Models: Core humanities journals operate on subscription models
#
# RECOMMENDATION FOR USERS:
# For comprehensive humanities research, users should create custom configurations
# with institutional database access. Call get_help() for guidance on adding
# authenticated sources (JSTOR, Project MUSE, etc.).
#
# See also: philosophy.yaml for specific philosophy research limitations
#
# EXPECTED BEHAVIOR:
# Humanities queries will return 0-10 papers, primarily from:
# - Open Library (books, not academic papers)
# - CORE Repository (if user has API key)
# - Interdisciplinary sources from other categories
# This is correct behavior given free database constraints.