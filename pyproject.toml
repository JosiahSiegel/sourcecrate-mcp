[project]
name = "paperez-mcp"
version = "1.0.0"
description = "PaperezMCP - Academic paper research made easy with full-text retrieval and multi-source search"
authors = [{name = "Josiah Siegel"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["academic", "research", "scholar", "mcp", "papers", "full-text", "arxiv", "citations"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Education",
    "Topic :: Text Processing :: Linguistic"
]

dependencies = [
    "fastmcp>=2.12.0",
    "scholarly>=1.7.11",
    "httpx[http2]>=0.25.0",
    "aiohttp>=3.8.0",
    "requests>=2.28.0",
    "PyMuPDF>=1.23.0",
    "pymupdf4llm>=0.0.17",
    "pdfplumber>=0.10.0",
    "lxml>=4.9.0",
    "beautifulsoup4>=4.12.0",
    "asyncio-throttle>=1.0.2",
    "fake-useragent>=1.4.0",
    "arxiv>=2.0.0",
    "pymed>=0.8.9",
    "semanticscholar>=0.8.0",
    "tenacity>=8.2.0",
    "diskcache>=5.6.0",
    "free-proxy>=1.1.1"
]

[project.urls]
Homepage = "https://github.com/JosiahSiegel/paperez-mcp"
Repository = "https://github.com/JosiahSiegel/paperez-mcp"
Issues = "https://github.com/JosiahSiegel/paperez-mcp/issues"
Documentation = "https://github.com/JosiahSiegel/paperez-mcp#readme"

[project.scripts]
paperez-mcp = "paperez_mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperez_mcp"]

[tool.hatch.build.targets.wheel.sources]
"paperez_mcp_server.py" = "paperez_mcp_server.py"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "W", "B", "I", "N", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true