[project]
name = "sourcecrate"
version = "2.1.3"
description = "SourceCrate - Academic paper research made easy with full-text retrieval and multi-source search"
authors = [{name = "Josiah Siegel"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["academic", "research", "scholar", "mcp", "papers", "full-text", "arxiv", "citations"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Education",
    "Topic :: Text Processing :: Linguistic"
]

dependencies = [
    "fastmcp>=4.1,<5",
    "scholarly>=1.7.11",
    "httpx[http2]>=0.25.0",
    "aiohttp>=3.8.0",
    "requests>=2.28.0",
    "PyMuPDF>=1.23.0",
    "pymupdf4llm>=0.0.17",
    "beautifulsoup4>=4.12.0",
    "asyncio-throttle>=1.0.2",
    "fake-useragent>=1.4.0",
    "arxiv>=2.0.0,<5",
    "pymed>=0.8.9",
    "semanticscholar>=0.8.0",
    "tenacity>=8.2.0",
    "free-proxy>=1.1.1",
    "rapidfuzz>=3.0.0",
    "rank-bm25>=0.2.2",  # Lightweight BM25 implementation (numpy only, no scipy)
    "watchdog>=3.0.0"  # Enable hot-reloading for config files
]

[project.urls]
Homepage = "https://github.com/JosiahSiegel/sourcecrate-mcp"
Repository = "https://github.com/JosiahSiegel/sourcecrate-mcp"
Issues = "https://github.com/JosiahSiegel/sourcecrate-mcp/issues"
Documentation = "https://github.com/JosiahSiegel/sourcecrate-mcp#readme"

[project.scripts]
sourcecrate = "source_crate.cli:main"
sourcecrate-http = "source_crate.http_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML",
    "types-requests",
    "types-beautifulsoup4"
]
http = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.0.0",
    "sse-starlette>=3,<4",
    "python-multipart>=0.0.6"  # For file uploads (if needed in future)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["source_crate"]

[tool.hatch.build]
include = [
    "source_crate/**/*.py",
    "source_crate/**/*.yaml",
    "source_crate/**/*.yml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["source_crate*"]

[tool.setuptools.package-data]
"source_crate.default_configs" = ["*.yaml", "*.yml"]
"source_crate" = ["default_configs/*.yaml", "default_configs/*.yml"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
