# Pre-commit hooks for MCP server validation
# Alternative simple hook for basic syntax checking

- id: mcp-syntax-check
  name: MCP Server Syntax Check
  description: Check MCP server for syntax errors
  entry: python3 -m py_compile sourcecrate_mcp_server.py
  language: system
  files: ^sourcecrate_mcp_server\.py$
  pass_filenames: false

- id: mcp-validation
  name: MCP Server Validation
  description: Validate MCP server syntax and basic imports
  entry: python3 scripts/simple_mcp_check.py
  language: system
  files: ^sourcecrate_mcp_server\.py$
  pass_filenames: false