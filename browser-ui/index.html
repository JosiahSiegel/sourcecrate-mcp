<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperez - Academic Paper Research</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Paperez</h1>
        </header>

        <main>
            <!-- Search Section -->
            <section class="search-section">
                <form id="searchForm">
                    <div class="search-input">
                        <input
                            type="text"
                            id="searchQuery"
                            placeholder="Search papers (e.g., machine learning, DOI, author)"
                            required
                        >
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="pdfOnly">
                                <input type="checkbox" id="pdfOnly">
                                Only Direct Download
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Search</button>
                </form>
            </section>


            <!-- Results Section -->
            <section class="results-section">
                <div id="results" class="results-container">
                    <p class="placeholder">Search results will appear here</p>
                </div>
            </section>

            <!-- System Status Section -->
            <section class="status-section">
                <button onclick="checkStatus()" class="btn btn-secondary">System Status</button>
                <div id="systemStatus" class="system-status">
                    <p class="placeholder">Click to check system status</p>
                </div>
            </section>
        </main>

        <footer>
            <p><a href="https://github.com/JosiahSiegel/paperez-mcp" target="_blank">Paperez</a> · <span id="apiServer">localhost:8001</span></p>
        </footer>
    </div>

    <!-- Optional: Load config.js to override API URL (auto-generated by local-manager.sh or manually configured) -->
    <script src="config.js"></script>

    <script>
        // Fallback API URL if config.js doesn't exist
        // For local development:
        //   - Devcontainer: API runs on port 9000 (VS Code port forwarding)
        //   - Fly.io: API runs on port 8080 internally, HTTPS:443 externally
        // The app.js auto-detection handles both cases, this is just a final fallback
        if (!window.PAPEREZ_API_URL) {
            window.PAPEREZ_API_URL = 'http://localhost:9000';
        }
    </script>
    <!-- Load modular ES6 app -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
