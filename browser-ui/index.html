<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SourceCrate - Academic Paper Research</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SourceCrate</h1>
        </header>

        <main>
            <!-- Search Section -->
            <section class="search-section">
                <form id="searchForm">
                    <div class="search-input">
                        <input
                            type="text"
                            id="searchQuery"
                            placeholder="Search papers (e.g., machine learning, DOI, author)"
                            required
                        >
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="pdfOnly">
                                <input type="checkbox" id="pdfOnly">
                                Only Direct Download
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Search</button>
                </form>
            </section>


            <!-- Results Section -->
            <section class="results-section">
                <div id="results" class="results-container">
                    <p class="placeholder">Search results will appear here</p>
                </div>
            </section>

            <!-- System Status Section -->
            <section class="status-section">
                <button onclick="checkStatus()" class="btn btn-secondary">System Status</button>
                <div id="systemStatus" class="system-status">
                    <p class="placeholder">Click to check system status</p>
                </div>
            </section>
        </main>

        <footer>
            <p>SourceCrate · <span id="apiServer">Loading...</span></p>
        </footer>
    </div>

    <!--
        Optional: Load config.js to override API URL
        - Local dev: auto-generated by local-manager.sh with localhost:9000
        - Production: file doesn't exist (404), state.js auto-detection handles it
    -->
    <script src="config.js"></script>

    <!-- Load modular ES6 app -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
