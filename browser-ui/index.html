<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperez - Academic Paper Research</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Paperez</h1>
        </header>

        <main>
            <!-- Search Section -->
            <section class="search-section">
                <form id="searchForm">
                    <div class="search-input">
                        <input
                            type="text"
                            id="searchQuery"
                            placeholder="Search papers (e.g., machine learning, DOI, author)"
                            required
                        >
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="pdfOnly">
                                <input type="checkbox" id="pdfOnly">
                                Only Direct Download
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="relevanceThreshold">
                            Relevance: <span id="relevanceValue">45</span>%
                        </label>
                        <input type="range" id="relevanceThreshold" min="0" max="100" value="45" step="5">
                    </div>
                    <button type="submit" class="btn btn-primary">Search</button>
                </form>
            </section>

            <!-- Status Indicator -->
            <div id="statusIndicator" class="status-indicator"></div>

            <!-- Results Section -->
            <section class="results-section">
                <div id="results" class="results-container">
                    <p class="placeholder">Search results will appear here</p>
                </div>
            </section>

            <!-- System Status Section -->
            <section class="status-section">
                <button onclick="checkStatus()" class="btn btn-secondary">System Status</button>
                <div id="systemStatus" class="system-status">
                    <p class="placeholder">Click to check system status</p>
                </div>
            </section>
        </main>

        <footer>
            <p><a href="https://github.com/JosiahSiegel/paperez-mcp" target="_blank">Paperez</a> · <span id="apiServer">localhost:8000</span></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
