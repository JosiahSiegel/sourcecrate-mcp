version: '3.8'

services:
  # PaperezMCP HTTP Server
  paperez-http:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paperez-mcp-http
    ports:
      - "8000:8000"
    environment:
      # Optional: Add API keys for enhanced performance
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
      - CROSSREF_EMAIL=${CROSSREF_EMAIL:-}
      - NCBI_API_KEY=${NCBI_API_KEY:-}
    volumes:
      # Mount output directory for downloaded papers
      - ./paperez_data:/app/.paperez
      # Optional: Mount custom config
      - ./.paperez/config:/app/.paperez/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - paperez-network

  # Browser UI (Nginx serving static files)
  paperez-ui:
    image: nginx:alpine
    container_name: paperez-mcp-ui
    ports:
      - "3000:80"
    volumes:
      - ./browser-ui:/usr/share/nginx/html:ro
    depends_on:
      - paperez-http
    restart: unless-stopped
    networks:
      - paperez-network

networks:
  paperez-network:
    driver: bridge

volumes:
  paperez_data:
    driver: local
